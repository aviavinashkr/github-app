name: Funny GIF Comment

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  add-gif-comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add Funny GIF Comment
        uses: actions/github-script@v7
        with:
          script: |
            const gifs = [
              'https://media.giphy.com/media/JIX67tKnZb15m/giphy.gif',
              'https://media.giphy.com/media/3oFzmv2Q9WH5W2XKUK/giphy.gif',
              'https://media.giphy.com/media/26ufgV4Yde8jR57Be/giphy.gif',
              'https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif'
            ];
            const randomGif = gifs[Math.floor(Math.random() * gifs.length)];
            await github.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🎉 Here's a funny GIF for you!\n\n![Funny GIF](${randomGif})`
            });
