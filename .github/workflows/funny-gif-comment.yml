name: Funny GIF Comment

on:
  pull_request:
    types: [opened, edited, reopened]
  issues:
    types: [opened, edited]

jobs:
  add-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Add Funny GIF Comment
        uses: actions/github-script@v5
        with:
          github-token: ${{ secrets.TOKEN }}
          script: |
            const gifs = [
              'https://media.giphy.com/media/3o72F2dB6Kx0Lc3D0g/giphy.gif',
              'https://media.giphy.com/media/l0MYD6G9jJH8TZZAe/giphy.gif',
              'https://media.giphy.com/media/26tPzgdFu1c0rbTBu/giphy.gif'
            ];
            const randomGif = gifs[Math.floor(Math.random() * gifs.length)];
            await github.rest.issues.createComment({
              ...context.issue,
              body: `Here's a funny GIF for you! ${randomGif}`
            });
